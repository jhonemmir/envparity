name: Publish alpha to NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true

      - run: dotnet restore EnvParity.slnx
      - run: dotnet build EnvParity.slnx -c Release --no-restore
      - run: dotnet test EnvParity.slnx -c Release --no-build
      - run: dotnet pack src/EnvParity/EnvParity.csproj -c Release --no-build -o artifacts

      # The policy on nuget.org must exist before the first push.
      # NUGET_USER is the nuget.org profile name, not an email address.
      # The temp API key is valid for one hour: log in immediately before pushing.
      - name: NuGet login (OIDC to temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: NuGet push
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
